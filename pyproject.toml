[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "login-log-analyzer"
version = "0.2.1"
description = "Blue Team authentication and Windows security-event analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
login-log-analyzer = "login_log_analyzer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
